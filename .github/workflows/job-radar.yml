name: job-radar

on:
  schedule:
    - cron: "30 9 * * *"   # 09:30 UTC daily (~11:30 CEST) — full run with ATS discovery
  workflow_dispatch:           # manual run button
    inputs:
      force_digest:
        description: "Email the current top 20 even if nothing is new (tests the mail path)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

# Serialize Pages deployments (GitHub's recommended setup) so runs don't collide.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Job-level so the mail step's `if` can see it — the secrets context isn't
    # available in a step condition, but env is.
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci || npm install
      - run: npm run build
      - name: Collect jobs
        id: collect
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          # Direct-ATS discovery (optional). Set BRAVE_API_KEY, or the Google CSE pair.
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          JOB_RADAR_DIGEST_FORCE: ${{ inputs.force_digest }}
        run: npm start
      # Digest email — only when the run found something new (steps.collect.outputs.send).
      # Needs MAIL_USERNAME (the Gmail address) + MAIL_PASSWORD (a Gmail *app password*,
      # not the account password) and MAIL_TO in repo secrets; skipped when unset.
      - name: Email new jobs
        if: steps.collect.outputs.send == 'true' && env.MAIL_USERNAME != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Job Radar <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: ${{ steps.collect.outputs.subject }}
          html_body: file://digest.html
          convert_markdown: false
      - name: Commit data
        run: |
          git config user.name "job-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git commit -m "data: refresh $(date -u +%FT%TZ)" || echo "no changes"
          git push
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with: { path: data }

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      # GitHub Pages intermittently returns "Deployment failed, try again later".
      # First attempt tolerates that; the retry recovers it so the run stays green.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Retry deploy on transient Pages failure
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
